# Registers the bundled TH Sarabun New font with JasperReports so the PDF
# exporter can embed it (and the native glyph renderer can shape Thai with it).
net.sf.jasperreports.extension.registry.factory.thai.fonts=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.thai=fonts/fonts.xml
